Object.entries(details).filter(([,d])=>d.x!=null).forEach(([id,d])=>{const g=el('g',{class:'node','data-node':id,tabindex:0,role:'button','aria-label':'查看'+d.title+'的输入输出与审批'});const c=d.kind==='teal'?'teal':d.kind==='rose'?'rose':'blue';g.append(el('rect',{class:'box',x:d.x,y:d.y,width:240,height:128,rx:13,fill:'var(--paper)',stroke:'var(--line)','stroke-width':1.3}));g.append(el('rect',{x:d.x+17,y:d.y+16,width:31,height:23,rx:6,fill:`var(--${c}-soft)`}));g.append(el('text',{x:d.x+32.5,y:d.y+32,'text-anchor':'middle','font-size':12,'font-weight':700,fill:`var(--${c})`},d.num));g.append(el('text',{x:d.x+60,y:d.y+32,'font-size':11,fill:'var(--muted)'},d.badge||(id==='thread'?'全阶段关联':'Agent 工作 · 人工批准')));g.append(el('text',{x:d.x+18,y:d.y+70,'font-size':21,'font-weight':650,fill:'var(--ink)'},d.title));g.append(el('text',{x:d.x+18,y:d.y+102,'font-size':13,fill:'var(--muted)'},d.subtitle));nodeLayer.append(g);});
const modal=document.getElementById('modal');let lastFocus=null;
function openDetail(id){const d=details[id];if(!d)return;lastFocus=document.activeElement;document.getElementById('detail-kicker').textContent=d.role;document.getElementById('detail-title').textContent=d.title;document.getElementById('detail-sub').textContent='本图已补充用户确认事项与会议线索；候选字段和业务规则仍需实现及企业验证。';const body=document.getElementById('detail-body');body.replaceChildren();for(const [label,text] of d.rows){const row=document.createElement('div');row.className='detail-row';const l=document.createElement('div');l.className='detail-label';l.textContent=label;const t=document.createElement('div');t.textContent=text;row.append(l,t);body.append(row);}const note=document.createElement('div');note.className='detail-note';note.textContent=d.note;body.append(note);modal.hidden=false;document.getElementById('close').focus();}
function closeDetail(){modal.hidden=true;if(lastFocus)lastFocus.focus();}
document.querySelectorAll('[data-node]').forEach(n=>{n.addEventListener('click',()=>openDetail(n.dataset.node));n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(n.dataset.node);}});});
document.getElementById('rules').addEventListener('click',()=>openDetail('rules'));document.getElementById('close').addEventListener('click',closeDetail);modal.addEventListener('click',e=>{if(e.target===modal)closeDetail();});document.addEventListener('keydown',e=>{if(!modal.hidden&&e.key==='Escape')closeDetail();if(!modal.hidden&&e.key==='Tab'){e.preventDefault();document.getElementById('close').focus();}});
document.getElementById('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';const b=document.getElementById('theme');b.textContent=dark?'浅色':'深色';b.setAttribute('aria-label',dark?'切换为浅色主题':'切换为深色主题');});
let toastTimer;function toast(t){const n=document.getElementById('toast');n.textContent=t;n.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.hidden=true,3500);}
document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.getElementById('canvas').requestFullscreen)await document.getElementById('canvas').requestFullscreen();else toast('当前浏览器不支持全屏，可使用浏览器缩放。');}catch{toast('全屏未开启，可使用浏览器缩放。');}});
function svgString(){const clone=document.getElementById('diagram').cloneNode(true);const css=getComputedStyle(document.documentElement);clone.setAttribute('width','1600');clone.setAttribute('height','1000');clone.setAttribute('xmlns',ns);let s=new XMLSerializer().serializeToString(clone);s=s.replace(/var\((--[\w-]+)\)/g,(_,v)=>css.getPropertyValue(v).trim());return s.replace(/(<svg\b[^>]*>)/,'$1<rect width="1600" height="1000" fill="'+css.getPropertyValue('--paper').trim()+'"/>');}
function save(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
document.getElementById('export-svg').addEventListener('click',()=>{save(new Blob([svgString()],{type:'image/svg+xml;charset=utf-8'}),'鞋服CMS协作平台.svg');toast('SVG 已导出，保留当前主题。');});
document.getElementById('export-png').addEventListener('click',async()=>{const button=document.getElementById('export-png');button.disabled=true;let url;try{url=URL.createObjectURL(new Blob([svgString()],{type:'image/svg+xml;charset=utf-8'}));const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});const c=document.createElement('canvas');c.width=3200;c.height=2000;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)throw Error('empty');save(blob,'鞋服CMS协作平台.png');toast('PNG 已导出，分辨率 3200 × 2000。');}catch{toast('PNG 导出未成功，请使用 SVG 导出。');}finally{if(url)URL.revokeObjectURL(url);button.disabled=false;}});
</script>

</body></html>
