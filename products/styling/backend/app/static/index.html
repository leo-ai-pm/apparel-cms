<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个性化穿搭 Agent</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --primary:#3d7bff; --text:#1f2329; --muted:#8a919f; --border:#e5e8ef; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:720px; margin:0 auto; height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 16px; background:var(--card); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    header h1 { font-size:17px; margin:0; }
    header button { border:1px solid var(--border); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; }
    #chat { flex:1; overflow-y:auto; padding:16px; }
    .msg { margin-bottom:14px; display:flex; }
    .msg.user { justify-content:flex-end; }
    .bubble { max-width:82%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-break:break-word; font-size:15px; line-height:1.6; }
    .msg.user .bubble { background:var(--primary); color:#fff; }
    .msg.assistant .bubble { background:var(--card); border:1px solid var(--border); }
    .status { color:var(--muted); font-size:12px; margin:6px 2px; }
    .error { color:#d43f3f; font-size:13px; }
    footer { padding:12px; background:var(--card); border-top:1px solid var(--border); display:flex; gap:8px; }
    #input { flex:1; border:1px solid var(--border); border-radius:10px; padding:12px; font-size:15px; resize:none; font-family:inherit; }
    #send { border:none; background:var(--primary); color:#fff; border-radius:10px; padding:0 20px; font-size:15px; cursor:pointer; }
    #send:disabled { opacity:.5; cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>个性化穿搭 Agent</h1>
      <button id="new">新对话</button>
    </header>
    <div id="chat"></div>
    <footer>
      <textarea id="input" rows="2" placeholder="例如：我要去面试，身高160体重52kg，梨形身材，预算500以内，帮我搭一套"></textarea>
      <button id="send">发送</button>
    </footer>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const newBtn = document.getElementById('new');

    function getSession() {
      let id = localStorage.getItem('session_id');
      if (!id) { id = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2); localStorage.setItem('session_id', id); }
      return id;
    }

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = text;
      div.appendChild(b);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return b;
    }

    function addStatus(text) {
      const div = document.createElement('div');
      div.className = 'status';
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function handleEvent(event, data) {
      if (event === 'chunk') {
        if (data.type === 'status') { addStatus(data.message); }
        else if (data.type === 'text') {
          let last = chat.querySelector('.msg.assistant .bubble');
          if (!last) last = addBubble('assistant', '');
          last.textContent += data.content;
          chat.scrollTop = chat.scrollHeight;
        }
      } else if (event === 'done') {
        // 修正为完整结果
        let last = chat.querySelector('.msg.assistant .bubble');
        if (last) last.textContent = data.content;
        send.disabled = false;
      } else if (event === 'error') {
        const div = document.createElement('div');
        div.className = 'error';
        div.textContent = '错误：' + (data.error && data.error.message ? data.error.message : '未知错误');
        chat.appendChild(div);
        send.disabled = false;
      }
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      addBubble('user', text);
      input.value = '';
      send.disabled = true;
      const sessionId = getSession();
      try {
        const resp = await fetch('/api/v1/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, message: text })
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const raw = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            let ev = '', data = '';
            for (const line of raw.split('\n')) {
              if (line.startsWith('event:')) ev = line.slice(6).trim();
              else if (line.startsWith('data:')) data += line.slice(5).trim();
            }
            if (data) handleEvent(ev, JSON.parse(data));
          }
        }
      } catch (e) {
        const div = document.createElement('div');
        div.className = 'error';
        div.textContent = '请求失败：' + e.message;
        chat.appendChild(div);
        send.disabled = false;
      }
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    newBtn.addEventListener('click', () => { localStorage.removeItem('session_id'); chat.innerHTML = ''; addStatus('已开始新对话'); });
  </script>
</body>
</html>
