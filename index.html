'use strict';
const details={
product:{num:'01',title:'产品需求',subtitle:'归纳证据 · 形成需求单',x:80,y:200,kind:'blue',role:'产品部门 / 产品需求 Agent',rows:[['输入','来自客服、私域、穿搭推荐的需求信号，以及上一轮产品档案中的历史数据。'],['Agent 工作','归纳诉求、关联证据、识别资料缺项，形成可供设计理解的需求单。'],['人工审批','产品负责人审核需求与依据。批准后才交给设计，不能由 Agent 自行越级推进。'],['输出','需求单、相关证据、目标与约束，关联到同一产品档案。']],note:'需求采纳标准、实际负责岗位和部门归属尚需企业访谈。'},
design:{num:'02',title:'鞋服设计',subtitle:'样式方案 · 设计版本',x:420,y:200,kind:'blue',role:'设计部门 / 鞋服设计 Agent',rows:[['输入','已批准需求，以及可用的历史设计、材料、工艺与成本约束。'],['Agent 工作','辅助形成新的鞋服样式，整理方案与版本；实际所需技术文件由专业人员补齐和核验。'],['人工审批','设计负责人审核后提交快反决策。被打样环节退回时，在原依据上修订并提交新版本。'],['输出','设计样式及对应说明、版本和关联材料；具体交付深度待核实。']],note:'效果图不等于可直接生产的设计文件。退回后的修订应保留旧版和原因，这一版本机制属于当前讨论建议。'},
decision:{num:'03',title:'快反决策',subtitle:'现有与历史数据 · 方案比较',x:760,y:200,kind:'blue',role:'快反决策角色 / 决策 Agent',rows:[['输入','已批准设计、需求证据、现有数据和历史数据。'],['Agent 工作','比较方案、列明依据和不确定性，辅助形成是否继续投入打样等决策建议。'],['人工审批','有相应业务权限的人员审核并批准，才能进入打样环节。'],['输出','决策建议、比较依据、批准记录和下一阶段任务。']],note:'“快反决策”是否由独立部门承担、究竟决定立项/首单/补单，以及需要哪些数据，均待访谈。'},

const ns='http://www.w3.org/2000/svg';
function el(name,attrs,text){const n=document.createElementNS(ns,name);Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));if(text!=null)n.textContent=text;return n;}
const nodeLayer=document.getElementById('nodes');
Object.entries(details).filter(([,d])=>d.x!=null).forEach(([id,d])=>{const g=el('g',{class:'node','data-node':id,tabindex:0,role:'button','aria-label':'查看'+d.title+'的输入输出与审批'});const c=d.kind==='teal'?'teal':d.kind==='rose'?'rose':'blue';g.append(el('rect',{class:'box',x:d.x,y:d.y,width:250,height:128,rx:13,fill:'var(--paper)',stroke:'var(--line)','stroke-width':1.3}));g.append(el('rect',{x:d.x+17,y:d.y+16,width:31,height:23,rx:6,fill:`var(--${c}-soft)`}));g.append(el('text',{x:d.x+32.5,y:d.y+32,'text-anchor':'middle','font-size':12,'font-weight':700,fill:`var(--${c})`},d.num));g.append(el('text',{x:d.x+60,y:d.y+32,'font-size':11,fill:'var(--muted)'},id==='thread'?'全阶段关联':'AI 辅助 · 人工负责'));g.append(el('text',{x:d.x+18,y:d.y+70,'font-size':22,'font-weight':650,fill:'var(--ink)'},d.title));g.append(el('text',{x:d.x+18,y:d.y+102,'font-size':13,fill:'var(--muted)'},d.subtitle));nodeLayer.append(g);});
const modal=document.getElementById('modal');let lastFocus=null;
function openDetail(id){const d=details[id];if(!d)return;lastFocus=document.activeElement;document.getElementById('detail-kicker').textContent=d.role;document.getElementById('detail-title').textContent=d.title;document.getElementById('detail-sub').textContent='以下说明用于交流。希望结合本地企业的真实案例，核对工作内容、责任人和交接规则。';const body=document.getElementById('detail-body');body.replaceChildren();for(const [label,text] of d.rows){const row=document.createElement('div');row.className='detail-row';const l=document.createElement('div');l.className='detail-label';l.textContent=label;const t=document.createElement('div');t.textContent=text;row.append(l,t);body.append(row);}const note=document.createElement('div');note.className='detail-note';note.textContent=d.note;body.append(note);modal.hidden=false;document.getElementById('close').focus();}
function closeDetail(){modal.hidden=true;if(lastFocus)lastFocus.focus();}
document.querySelectorAll('[data-node]').forEach(n=>{n.addEventListener('click',()=>openDetail(n.dataset.node));n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(n.dataset.node);}});});
document.getElementById('rules').addEventListener('click',()=>openDetail('rules'));document.getElementById('close').addEventListener('click',closeDetail);modal.addEventListener('click',e=>{if(e.target===modal)closeDetail();});document.addEventListener('keydown',e=>{if(!modal.hidden&&e.key==='Escape')closeDetail();if(!modal.hidden&&e.key==='Tab'){e.preventDefault();document.getElementById('close').focus();}});
document.getElementById('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';const b=document.getElementById('theme');b.textContent=dark?'浅色':'深色';b.setAttribute('aria-label',dark?'切换为浅色主题':'切换为深色主题');});
let toastTimer;function toast(t){const n=document.getElementById('toast');n.textContent=t;n.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.hidden=true,3500);}
document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.getElementById('canvas').requestFullscreen)await document.getElementById('canvas').requestFullscreen();else toast('当前浏览器不支持全屏，可使用浏览器缩放。');}catch{toast('全屏未开启，可使用浏览器缩放。');}});
function svgString(){const clone=document.getElementById('diagram').cloneNode(true);const css=getComputedStyle(document.documentElement);clone.setAttribute('width','1440');clone.setAttribute('height','848');clone.setAttribute('xmlns',ns);let s=new XMLSerializer().serializeToString(clone);s=s.replace(/var\((--[\w-]+)\)/g,(_,v)=>css.getPropertyValue(v).trim());return s.replace(/(<svg\b[^>]*>)/,'$1<rect width="1440" height="848" fill="'+css.getPropertyValue('--paper').trim()+'"/>');}
function save(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
document.getElementById('export-svg').addEventListener('click',()=>{save(new Blob([svgString()],{type:'image/svg+xml;charset=utf-8'}),'鞋服CMS协作平台.svg');toast('SVG 已导出，保留当前主题。');});
document.getElementById('export-png').addEventListener('click',async()=>{const button=document.getElementById('export-png');button.disabled=true;let url;try{url=URL.createObjectURL(new Blob([svgString()],{type:'image/svg+xml;charset=utf-8'}));const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});const c=document.createElement('canvas');c.width=2880;c.height=1696;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)throw Error('empty');save(blob,'鞋服CMS协作平台.png');toast('PNG 已导出，分辨率 2880 × 1696。');}catch{toast('PNG 导出未成功，请使用 SVG 导出。');}finally{if(url)URL.revokeObjectURL(url);button.disabled=false;}});
</script>
